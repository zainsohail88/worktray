name: CodeQL

# GitHub's code security scanner. Results appear under Security, Code scanning.
# Free for public repositories; private repositories need GitHub Advanced Security.
# This workflow is the repository's "advanced setup": keep CodeQL's "default setup" off in
# Settings, Advanced Security, or GitHub refuses the results uploaded here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC, to catch newly published queries

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # CodeQL reads its own workflow run; required on private repositories
      contents: read
      security-events: write # upload results
    strategy:
      fail-fast: false
      matrix:
        # "actions" scans the workflow files themselves, for problems such as script injection.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
