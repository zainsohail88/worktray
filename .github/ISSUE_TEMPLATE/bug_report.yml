name: Bug report
description: worktray crashes or does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security problems privately, as described in [SECURITY.md](https://github.com/zainsohail88/worktray/blob/main/SECURITY.md), not here.

        Leave out tokens, internal URLs, ticket titles, names and other workplace data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Turn on the GitHub source\n2. Click Sync"
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: jira, github, calendar or a plugin name
  - type: textarea
    id: detail
    attributes:
      label: Error message
      description: The error shown, or the text for the source on the Connections tab, with private details removed.
      render: shell
  - type: input
    id: version
    attributes:
      label: Output of `worktray --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
    validations:
      required: true
