name: Feature request
description: Suggest a change or a new source
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to do and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: For a new source, the API or CLI it would read and how you sign in to it. A source can also be a separate package, see CONTRIBUTING.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
